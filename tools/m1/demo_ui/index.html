<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RISK-KV · 实物演示台</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#10151e;color:#e6edf6}body{max-width:1360px;margin:36px auto;padding:0 28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #304054;padding-bottom:24px}h1{font-size:30px;margin:0}small,.muted{color:#99abc1}p{line-height:1.65}.badge{background:#28374a;border-radius:24px;padding:10px 18px;color:#8edcc8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}.card{background:#18212e;border:1px solid #304054;border-radius:16px;padding:24px}h2{font-size:17px;color:#a6b9d0;font-weight:500;margin:0 0 20px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:20px}.num{font-size:28px;font-weight:650;display:block;margin-top:5px}button{background:#27415c;color:#fff;border:1px solid #456987;border-radius:9px;padding:12px 16px;margin:5px;cursor:pointer;font-size:15px}button:hover{background:#355875}button:disabled{opacity:.4;cursor:default}#events{height:260px;overflow:auto;white-space:pre-wrap;line-height:1.7;font-family:ui-monospace,monospace;font-size:13px}#notice{color:#f4c67d}a{color:#83cdbd}.wide{grid-column:1/-1}#identity{overflow-wrap:anywhere}#tokens{font-size:24px;color:#8edcc8}@media(max-width:800px){.grid{grid-template-columns:1fr}header{display:block}.badge{display:inline-block;margin-top:12px}}
body{padding:20px}header{padding-bottom:12px;margin-bottom:14px}h1{font-size:28px}.card{padding:18px}.card h2{font-size:17px;margin:0 0 14px}.card p{font-size:14px;margin:10px 0}.metrics{gap:14px}.num{font-size:26px;margin-top:4px}button{font-size:14px;padding:9px 12px;margin:4px}#events{height:160px}#tokens{font-size:22px}</style>
<header><div><h1>RISK-KV <span class="muted">实物演示台</span></h1><p class="muted">一次构建 · 多批共享 · 安全回收</p></div><span class="badge">M1 · 实验配置 · 验收状态见记录</span></header>
<p id="notice">正在读取运行状态…</p><div class="grid">
<section class="card"><h2>设备与验证</h2><div class="metrics"><div>连接<span id="connection" class="num">—</span></div><div>运行阶段<span id="phase" class="num">—</span></div></div><p id="identity" class="muted"></p><p id="validation"></p><p id="ddrstate" class="muted">DDR / 镜像：未核验</p><button data-action="inspect">设备预检</button><button data-action="load">装载并校验镜像</button></section>
<section class="card"><h2>共享前缀对象</h2><div class="metrics"><div>本次完整构建<span id="prefixcount" class="num">—</span></div><div>在途访存<span id="outstanding" class="num">—</span></div><div>构建 token<span id="built" class="num">—</span></div><div>对象代际<span id="generation" class="num">—</span></div><div>成功计算提交<span id="committed" class="num">—</span></div><div>已清理字节<span id="clean" class="num">—</span></div></div></section>
<section class="card"><h2>连续服务</h2><button data-action="build">构建并封存前缀</button><button data-action="query-a">第一组双查询</button><button data-action="release">释放查询并清尾</button><button data-action="query-b">第二组双查询</button><p id="tokens">等待真实计算输出</p><p class="muted">完整 Qwen3-0.6B · 256-token 前缀 · 每查询三步续算。输出用于计算验证。</p></section>
<section class="card"><h2>取消与恢复</h2><button data-action="cancel-recover">取消在途任务并恢复</button><button data-action="retire">退役当前对象</button><p class="muted">取消演示会退役旧对象，在新对象的真实构建任务执行期间取消，等待排空与清理，再重建恢复。</p><p id="fault"></p><a href="/api/report" target="_blank">导出本次运行记录</a></section>
<section class="card wide"><h2>现场执行记录</h2><div id="events"></div></section></div>
<script>
const token='__TOKEN__';let state=null;
const names={unloaded:'待装载',empty:'待构建',sealed:'已封存',bound:'查询已绑定',requires_recovery:'需要恢复'};
const fmt=x=>x===undefined?'—':Number(x).toLocaleString('zh-CN');
function allowed(a,s){if(s.busy)return false;return a==='inspect'||(a==='load'&&s.phase==='unloaded')||(a==='build'&&s.phase==='empty')||(['query-a','query-b'].includes(a)&&s.phase==='sealed')||(a==='release'&&s.phase==='bound')||(['retire','cancel-recover'].includes(a)&&['sealed','bound'].includes(s.phase));}
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error();state=await r.json();const o=state.observation||{};connection.textContent=state.stale?'未确认/数据过期':'在线';phase.textContent=state.busy?'执行中':(names[state.phase]||state.phase);identity.textContent='运行编号：'+state.run_id+(state.device?' · JTAG '+state.device.device_id+' · bit '+state.device.bit_sha256.slice(0,16):'');prefixcount.textContent=fmt(state.prefix_builds);outstanding.textContent=fmt(o.memory_outstanding);ddrstate.textContent='DDR 校准：'+(o.ddr_calibrated===undefined?'未核验':o.ddr_calibrated?'已校准':'未完成')+' · 当前连接镜像：'+(o.image_usable_in_this_connection?'全量校验有效':'未取得有效资格');validation.textContent=state.validation;built.textContent=fmt(o.built_tokens);generation.textContent=fmt(o.generation);committed.textContent=fmt(o.committed_tasks);clean.textContent=fmt(o.clear_cleaned_bytes);fault.textContent=o.isolated?'设备已隔离，禁止继续分配':'取消只阻止逻辑提交；回收必须等待真实退休。';notice.textContent=state.stale?'当前无新鲜设备快照；历史数值不能代表当前板卡状态。':'实时数据来自板卡。当前配置为实验性，不等于正式板级认证。';events.textContent=state.events.slice(-80).map(e=>new Date(e.time_ns/1e6).toLocaleTimeString()+'  '+e.message+(e.tokens?'  token '+e.tokens.join(' / '):'')+(e.error?'  '+e.error:'')).join('\n');events.scrollTop=events.scrollHeight;const t=state.events.filter(e=>e.tokens).at(-1);if(t)tokens.textContent='真实输出 token：'+t.tokens.join(' / ');document.querySelectorAll('button').forEach(b=>b.disabled=!allowed(b.dataset.action,state));}catch{notice.textContent='主机连接中断；停止显示实时状态。';connection.textContent='离线';document.querySelectorAll('button').forEach(b=>b.disabled=true);}}
document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json','X-RKV-Token':token},body:JSON.stringify({action:b.dataset.action,request_id:crypto.randomUUID()})});const j=await r.json();if(!r.ok)notice.textContent=j.error;}catch{notice.textContent='请求状态未知，请查看记录；不要重复提交。';}await refresh();});refresh();setInterval(refresh,1000);
</script></html>
